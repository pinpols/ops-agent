# worker(serve-worker):独立消费 Redis 队列 → 跑只读诊断 → 结果/重试/DLQ。
# 无 Service(不收外部流量);崩溃/重启可恢复(状态在 Redis)。水平扩展安全(BLMOVE 分发,
# per-worker processing list + reaper 回收硬崩在途任务,见 ADR-0003)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent-worker
  labels:
    app: ops-agent
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-agent
      component: worker
  template:
    metadata:
      labels:
        app: ops-agent
        component: worker
    spec:
      # 滚动更新时给在途任务排空时间:worker 收 SIGTERM 后 stop+join,排空窗口 =
      # OPS_MAX_RUN_SECONDS(默认 120s)+ 收尾余量。grace period 必须 ≥ 该窗口,
      # 否则 k8s 提前 SIGKILL,在途诊断卡 RUNNING(由 reaper 回收,但会多一次重试)。
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/pinpols/ops-agent:0.2.1   # 与 ingress 同镜像,生产 overlay 建议改用 digest
          args: ["serve-worker"]
          envFrom:
            - configMapRef:
                name: ops-agent-config
            - secretRef:
                name: ops-agent-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPS_APPROVAL_LOG
              value: "/var/lib/ops-agent/audit/$(POD_NAME)-approvals.jsonl"
          # liveness:心跳文件 mtime 新鲜度。主循环每秒 touch;>30s 未更新视为僵死 → 重启。
          # 比"进程在不在"更强:能检出主循环卡死/死锁(容器仍 Running 但不工作)。
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, sys, time
                  p = os.environ["OPS_WORKER_HEARTBEAT_FILE"]
                  fresh = os.path.exists(p) and (time.time() - os.path.getmtime(p) < 30)
                  sys.exit(0 if fresh else 1)
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /var/run/ops-agent
            - name: state
              mountPath: /app/.ops-agent
            - name: audit
              mountPath: /var/lib/ops-agent/audit
      volumes:
        # runtime 卷承载 OPS_METRICS_FILE(/var/run/ops-agent/metrics.prom)与心跳文件。
        # ⚠️ P1-4②:emptyDir 里的 metrics textfile **没有任何抓取方**,指标写了等于没写。
        # 两种接法(详见 deploy/k8s/README.md「worker 指标抓取」):
        #   A. node_exporter textfile collector:把 runtime 换成 hostPath,指向
        #      node_exporter --collector.textfile.directory 目录,例如:
        #        - name: runtime
        #          hostPath:
        #            path: /var/lib/node_exporter/textfile/ops-agent
        #            type: DirectoryOrCreate
        #      (需允许 hostPath 的 PodSecurity/OPA 白名单;多 worker 同节点会互相覆盖,
        #       建议 OPS_METRICS_FILE 带 $(POD_NAME) 前缀区分)
        #   B. sidecar exporter:同 Pod 加一个只读挂 runtime 的 nginx/exporter 容器,
        #      以 HTTP 暴露 metrics.prom,配 prometheus.io/scrape 注解。
        # 默认保持 emptyDir(可移植、无节点权限要求),接法由部署方按集群策略二选一。
        - name: runtime
          emptyDir: {}
        - name: state
          emptyDir: {}
        - name: audit
          persistentVolumeClaim:
            claimName: ops-agent-audit
---
# worker 扩容:CPU 是可移植的起步指标。
# 更贴切的是按 queue_depth 扩(需 prometheus-adapter 把 ops_agent_queue_depth 暴露成
# External/Object metric),示例见注释。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ops-agent-worker
  labels:
    app: ops-agent
    component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ops-agent-worker
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    # 按队列深度扩(取消注释,需 prometheus-adapter 已配 ops_agent_queue_depth):
    # - type: External
    #   external:
    #     metric:
    #       name: ops_agent_queue_depth
    #     target:
    #       type: AverageValue
    #       averageValue: "20"   # 每副本目标承担 20 待处理
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 缩容慢一点,防抖
