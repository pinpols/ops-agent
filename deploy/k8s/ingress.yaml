# ingress(serve):接告警 webhook → 鉴权 → 入队 → 202。无状态,可多副本。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent-ingress
  labels:
    app: ops-agent
    component: ingress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-agent
      component: ingress
  template:
    metadata:
      labels:
        app: ops-agent
        component: ingress
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingress
          image: ghcr.io/pinpols/ops-agent:latest   # 按实际 registry/tag 覆盖
          args: ["serve", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ops-agent-config
            - secretRef:
                name: ops-agent-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPS_APPROVAL_LOG
              value: "/var/lib/ops-agent/audit/$(POD_NAME)-approvals.jsonl"
          # liveness:进程能服务即存活(后端抖动不重启 pod)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness:redis 后端不可达 → 摘出 Service,恢复后自动回流
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /var/run/ops-agent
            - name: state
              mountPath: /app/.ops-agent
            - name: audit
              mountPath: /var/lib/ops-agent/audit
      volumes:
        - name: runtime
          emptyDir: {}
        - name: state
          emptyDir: {}
        - name: audit
          persistentVolumeClaim:
            claimName: ops-agent-audit
---
apiVersion: v1
kind: Service
metadata:
  name: ops-agent-ingress
  labels:
    app: ops-agent
    component: ingress
spec:
  selector:
    app: ops-agent
    component: ingress
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 按入队压力对 ingress 横向扩(CPU 起步;入口主要是鉴权+入队,通常 2 副本够)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ops-agent-ingress
  labels:
    app: ops-agent
    component: ingress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ops-agent-ingress
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ops-agent-audit
  labels:
    app: ops-agent
    component: audit
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
