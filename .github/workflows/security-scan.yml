name: Security Scan

on:
  push:
    branches: [main]
    paths: ["ops_agent/**", "evals/**", "pyproject.toml", "uv.lock"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Weekly Monday 2am UTC

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit (Python secrets/crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit[toml]
      - run: bandit -r ops_agent evals -f json -o bandit-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  semgrep:
    name: Semgrep (SAST rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: |
          pip install semgrep
          semgrep --config=p/python --config=p/security-audit \
            ops_agent evals --json -o semgrep-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  pip-audit:
    name: pip-audit (Dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          summary: true
          require-hashes: false
