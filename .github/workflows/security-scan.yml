name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-scan.yml"
      - "ops_agent/**"
      - "evals/**"
      - "pyproject.toml"
      - "requirements.lock"
      - "uv.lock"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Weekly Monday 2am UTC

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit (Python secrets/crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit[toml]
      - run: bandit -r ops_agent evals -f json -o bandit-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  semgrep:
    name: Semgrep (SAST rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          pip install semgrep
          semgrep --config=p/python --config=p/security-audit \
            ops_agent evals --json -o semgrep-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  pip-audit:
    name: pip-audit (Dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit locked Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc -r requirements.lock
