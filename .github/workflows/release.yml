name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release version
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          PYPROJECT_VERSION=$(python - <<'PY'
          import tomllib
          print(tomllib.loads(open("pyproject.toml", "rb").read().decode())["project"]["version"])
          PY
          )
          PACKAGE_VERSION=$(python - <<'PY'
          import re
          print(re.search(r'__version__ = "([^"]+)"', open("ops_agent/__init__.py").read()).group(1))
          PY
          )
          test "$PYPROJECT_VERSION" = "$NEW_VERSION"
          test "$PACKAGE_VERSION" = "$NEW_VERSION"
          grep -q "^## $NEW_VERSION " CHANGELOG.md
      - name: Create and push tag
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git diff --exit-code
          git tag -a "v$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "v$NEW_VERSION"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          NOTES=$(awk -v version="$VERSION" '
            $0 ~ "^## " version " " {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md)
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$NOTES" \
            --verify-tag
