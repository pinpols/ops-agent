name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # 项目声明 requires-python>=3.11,两版都要过
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy ops_agent evals

      - name: Test + coverage gate
        # 实测 76%;闸设 70 留 6pt 余量防回退,后续补 run_eval/graph_agent 测试再上调。
        run: pytest --cov=ops_agent --cov=evals --cov-report=term-missing --cov-fail-under=70

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("ops_agent-*.whl"))
          assert wheels, "wheel was not produced"
          with zipfile.ZipFile(wheels[-1]) as wheel:
              names = set(wheel.namelist())
          assert "ops_agent/sql_templates/manifest.json" in names
          assert any(name.startswith("ops_agent/sql_templates/") and name.endswith(".sql") for name in names)
          PY

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Docker image
        run: docker build -t ops-agent:ci .

      - name: Smoke Docker redis backend import
        run: docker run --rm --entrypoint python ops-agent:ci -c "import ops_agent.redisqueue"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependency vuln scan (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit bandit
          # 生产门禁:依赖漏洞扫描必须阻断发布。需要例外时应提交受控 ignore/baseline,不能静默放过。
          pip-audit --desc -r requirements.lock
      - name: Static security scan (Bandit high severity)
        run: |
          # 现有 Medium/Low 已在代码注释/部署边界中接受;CI 先硬卡 High,避免真正高危回归被噪声淹没。
          bandit -q -r ops_agent evals -x tests --severity-level high
      - name: Generate dependency SBOM
        run: |
          pip-audit --format cyclonedx-json --output sbom.json -r requirements.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom
          path: sbom.json

  eval:
    # 离线 eval 是硬闸;LLM-as-judge 只在仓库配置 ANTHROPIC_API_KEY 时启用。
    # fork PR 不暴露 secret,但仍可跑确定性/对抗门禁。
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,graph]"
      - name: Offline eval regression gate
        run: |
          # 无需外部密钥的结构/评分/注入防护单测,作为所有 push/同仓 PR 的稳定硬闸。
          pytest tests/test_eval_cases.py tests/test_run_eval.py tests/test_scorers.py tests/test_prompt_injection.py
      - name: LLM judge eval gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY 未配置;跳过 LLM-as-judge,离线 eval 已作为硬闸执行。"
            exit 0
          fi
          ops-agent eval --judge --fail-under 0.6
          python -m evals.run_adversarial
