name: Generate SBOM

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # 包名是 cyclonedx-bom(提供 cyclonedx-py CLI);从 requirements.txt 生成 SBOM,
      # 退化到 environment。发布产物必须可生成,失败即阻断。
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.json \
            || cyclonedx-py environment --output-format JSON --output-file sbom.json
          cyclonedx-py requirements requirements.txt --output-format XML --output-file sbom.xml \
            || cyclonedx-py environment --output-format XML --output-file sbom.xml
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.*
          if-no-files-found: ignore
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          files: sbom.*
