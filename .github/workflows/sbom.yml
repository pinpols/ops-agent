name: Generate SBOM

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
      # 包名是 cyclonedx-bom(提供 cyclonedx-py CLI);从 requirements.txt 生成 SBOM,
      # 退化到 environment。SBOM 为非关键供应链产物,continue-on-error 避免语法变体卡 CI。
      - name: Generate SBOM
        continue-on-error: true
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.json \
            || cyclonedx-py environment --output-format JSON --output-file sbom.json
          cyclonedx-py requirements requirements.txt --output-format XML --output-file sbom.xml \
            || cyclonedx-py environment --output-format XML --output-file sbom.xml || true
      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.*
          if-no-files-found: ignore
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: sbom.*
