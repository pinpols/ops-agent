[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-agent"
version = "0.1.0"
description = "A small operations diagnosis agent with tool calling, HITL execution, evals, and observability hooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
graph = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
]
observability = [
    "langfuse>=3.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
ops-agent = "ops_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ops_agent*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:create_react_agent has been moved to `langchain.agents`:langgraph.warnings.LangGraphDeprecatedSinceV10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B904",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
